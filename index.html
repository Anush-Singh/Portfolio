<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anush Singh | AI Engineer & Backend Developer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6fa;--ink:#3a2a52;--mute:#75668e;--card:rgba(255,255,255,.62);--bd:rgba(255,255,255,.9);--b1:#ffc8dd;--b2:#cdb8ff;--b3:#bde0fe;--b4:#ffd9b8;--acc:#d6558c;--acc2:#7c5cd1;--sh:0 14px 40px rgba(150,110,200,.18);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1330;--ink:#f6eefc;--mute:#bfb0dc;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--b1:#a63f7a;--b2:#5b3fb0;--b3:#2f6aa8;--b4:#a8643a;--acc:#ff8fbf;--acc2:#b9a2ff;--sh:0 14px 40px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1330;--ink:#f6eefc;--mute:#bfb0dc;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--b1:#a63f7a;--b2:#5b3fb0;--b3:#2f6aa8;--b4:#a8643a;--acc:#ff8fbf;--acc2:#b9a2ff;--sh:0 14px 40px rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "DM Sans",system-ui,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.08}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px;border-radius:12px}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:dr 18s ease-in-out infinite alternate;will-change:transform}
.blobs i:nth-child(1){width:46vmax;height:46vmax;background:var(--b1);left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){width:40vmax;height:40vmax;background:var(--b2);right:-12vmax;top:18vh;animation-delay:-6s}
.blobs i:nth-child(3){width:38vmax;height:38vmax;background:var(--b3);left:10vw;bottom:-16vmax;animation-delay:-11s}
.blobs i:nth-child(4){width:28vmax;height:28vmax;background:var(--b4);right:8vw;bottom:-8vmax;animation-delay:-3s}
@keyframes dr{to{transform:translate(8vw,6vh) scale(1.15)}}
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(16px);box-shadow:var(--sh);max-width:94vw}
nav a{text-decoration:none;font-size:15px;font-weight:500;padding:8px 16px;border-radius:999px;color:var(--mute);transition:background .25s,color .25s}
nav a:hover{background:var(--b1);color:#3a2a52}
@media(max-width:600px){nav a{padding:8px 11px;font-size:14px}nav a:nth-child(5){display:none}}
.w{max-width:1480px;margin:0 auto;padding:0 clamp(20px,5vw,80px)}
#hero{min-height:100vh;display:flex;align-items:center;padding:130px 0 70px}
.tag{display:inline-block;padding:7px 18px;border-radius:999px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-size:15px;color:var(--mute);margin-bottom:22px;animation:fu .9s both}
h1{font-size:clamp(3.2rem,9vw,8rem);font-weight:700;letter-spacing:-.035em}
h1 span{display:inline-block;animation:fu 1s cubic-bezier(.2,.8,.2,1) both}
h1 span:nth-child(2){animation-delay:.18s;font-style:italic;font-weight:500;color:var(--acc)}
@keyframes fu{from{opacity:0;transform:translateY(40px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.role{margin:20px 0 8px;font:italic 500 clamp(1.4rem,3.6vw,2.3rem) Fraunces,serif;color:var(--acc2);height:1.3em;animation:fu 1s .35s both}
.role b{font-weight:inherit;display:inline-block;animation:sw .6s both}
@keyframes sw{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.lead{max-width:640px;color:var(--mute);font-size:19px;animation:fu 1s .5s both}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;animation:fu 1s .65s both}
.btn{padding:14px 30px;border-radius:999px;text-decoration:none;font-weight:700;transition:transform .3s,box-shadow .3s}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 10px 28px rgba(150,90,200,.35)}
.btn.g{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px)}
.btn:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 16px 36px rgba(150,90,200,.35)}
section{padding:90px 0}
h2{font-size:clamp(2.1rem,5vw,3.4rem);letter-spacing:-.02em;margin-bottom:34px}
h2 em{font-style:italic;font-weight:500;color:var(--acc)}
.rv{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.rv.on{opacity:1;transform:none;filter:none}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:28px;backdrop-filter:blur(18px);box-shadow:var(--sh);padding:30px}
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:stretch}
@media(max-width:800px){.about{grid-template-columns:1fr}}
.about p{margin:0 0 12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{border-radius:24px;padding:22px 16px;text-align:center;transition:transform .35s}
.stat:nth-child(1){background:var(--b1)}.stat:nth-child(2){background:var(--b2)}.stat:nth-child(3){background:var(--b3)}.stat:nth-child(4){background:var(--b4)}
.stat:hover{transform:translateY(-6px) rotate(-1.5deg)}
.stat b{display:block;font:700 clamp(1.9rem,4.5vw,2.8rem) Fraunces,serif;color:#3a2a52}
.stat span{font-size:15px;color:#4d3d68}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:22px}
.skills h3{font-size:1.25rem;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips i{font-style:normal;font-size:15px;padding:6px 15px;border-radius:999px;background:var(--b1);color:#3a2a52;transition:transform .3s}
.skills>div:nth-child(2) .chips i{background:#b8f0d8}.skills>div:nth-child(2){background:rgba(120,225,185,.2);border-color:rgba(120,225,185,.55)}.skills>div:nth-child(3) .chips i{background:var(--b3)}.skills>div:nth-child(4) .chips i{background:var(--b4)}
.chips i:hover{transform:translateY(-4px) scale(1.08)}
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--acc),var(--acc2),transparent)}
.job{position:relative;margin-bottom:24px}
.job::before{content:"";position:absolute;left:-34px;top:34px;width:18px;height:18px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 7px rgba(214,85,140,.2);animation:pu 3s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 0 12px rgba(214,85,140,.05)}}
.when{font-size:14px;font-weight:700;color:var(--acc2);margin:4px 0 12px}
.job h3,.pc h3{font-size:1.4rem}
ul{margin:0;padding-left:20px;color:var(--mute)}
li{margin-bottom:7px}
li::marker{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:26px}
.pc{position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.pc::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--b1),var(--b2),var(--b3))}
.pc::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:var(--x,50%);top:var(--y,0);transform:translate(-50%,-50%);background:radial-gradient(var(--b2),transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none}
.pc:hover{transform:translateY(-8px);box-shadow:0 24px 54px rgba(150,100,210,.28)}
.pc:hover::after{opacity:.35}
.pc>*{position:relative}
.role2{color:var(--mute);margin:2px 0 12px;font-style:italic}
.certs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.cert{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 22px;border-radius:999px;background:var(--card);border:1px solid var(--bd);transition:transform .3s,background .3s}
.cert:hover{transform:translateX(6px);background:var(--b1);color:#3a2a52}
.cert small{white-space:nowrap;color:var(--acc2);font-weight:700}
.cert:hover small{color:#3a2a52}
#contact{text-align:center}
#contact .glass{padding:clamp(40px,8vw,90px) 6vw;border-radius:44px}
#contact h2{margin-bottom:12px}
#contact p{color:var(--mute);max-width:460px;margin:0 auto 30px}
#contact .btns{justify-content:center}
footer{text-align:center;color:var(--mute);font-size:14px;padding:10px 0 40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none;filter:none}}
#hero{gap:60px;flex-wrap:wrap-reverse;justify-content:space-between}
.hero-t{flex:1 1 560px}
.ph{position:relative;flex:0 1 400px;width:min(400px,72vw);aspect-ratio:9/16;margin:0 auto;animation:fu 1.1s .3s both}
.ph img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:999px 999px 48px 48px;border:6px solid var(--card);box-shadow:var(--sh),0 0 0 1px var(--bd);animation:flt 7s ease-in-out infinite}
.ring{position:absolute;inset:-18px;border-radius:999px 999px 64px 64px;background:conic-gradient(from 0deg,var(--b1),var(--b2),var(--b3),var(--b4),var(--b1));filter:blur(22px);opacity:.9;animation:spin 14s linear infinite}
@keyframes flt{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;animation:fu 1s .8s both}
.soc a{font-size:15px;font-weight:500;text-decoration:none;color:var(--mute);padding:6px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--card);transition:background .25s,color .25s,transform .25s}
.soc a:hover{background:var(--b2);color:#3a2a52;transform:translateY(-3px)}
.cl{margin:14px 0 0;color:var(--mute);font-size:15px}
.cl a{color:var(--acc2);font-weight:700;text-underline-offset:3px}
button.btn{font:inherit;font-weight:700;color:inherit;cursor:pointer}.dl[hidden]{display:none}
</style>
</head>
